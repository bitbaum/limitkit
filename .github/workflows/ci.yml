# GOLDEN CI FLOOR — pnpm. See bitbaum/fleet templates/ci/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json (SSOT);
      # pnpm/action-setup@v6 errors if both are specified.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: "verified" is defined ONCE, in package.json `verify`
      # (= lint + typecheck + build + test), and run identically here and
      # locally. The tests import the package BY NAME, so this also exercises
      # the `exports` map — a broken one fails here, not at a consumer's
      # install.
      - name: Verify
        run: pnpm run verify
